name: SonarCloud analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  Analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze with SonarCloud
        uses: SonarSource/sonarcloud-github-action@4006f663ecaf1f8093e8e4abb9227f6041f52216
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args:
            -Dsonar.projectKey=Ay4xx_SoftwareEspinaBifida
            -Dsonar.organization=ay4xx
            -Dsonar.scm.provider=git
            -Dsonar.sources=espina-bifida-app/src,espina-bifida-backend
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.min.js,**/coverage/**,**/e2e/**,**/playwright-report/**,**/test-results/**
            -Dsonar.javascript.node.maxspace=4096
            -Dsonar.jasmin.enabled=false
          projectBaseDir: .
